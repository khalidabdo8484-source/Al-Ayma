name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
      - name: Fix & Build
        run: |
          rm -rf android ios web windows macos linux
          flutter create . --project-name toktok_game --org com.toktok.game --platforms=android
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: toktok-apk
          path: build/app/outputs/flutter-apk/app-release.apk
