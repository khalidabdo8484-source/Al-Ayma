name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
      - run: |
          if [ -f lib/main.dart ]; then cp lib/main.dart /tmp/main.dart; fi
          flutter create. --project-name elayma --platforms android --org com.elayma.app
          if [ -f /tmp/main.dart ]; then cp /tmp/main.dart lib/main.dart; fi
          mkdir -p assets
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: elayma-apk
          path: build/app/outputs/flutter-apk/app-release.apk
