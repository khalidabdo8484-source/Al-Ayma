name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: 'stable'
          cache: true
      - run: |
          cp pubspec.yaml /tmp/p.yaml
          cp lib/main.dart /tmp/m.dart
          flutter create . --project-name toktok_game --org com.toktok.game --platforms=android
          cp /tmp/p.yaml pubspec.yaml
          cp /tmp/m.dart lib/main.dart
          flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: toktok-apk
          path: build/app/outputs/flutter-apk/app-release.apk
